<div class="music-player-mini" id="musicPlayerMini">
    <i class="fas fa-music" id="musicIcon" style="cursor:pointer"></i>
    <span id="musicTitle">Loading music...</span>
    <i class="fas fa-volume-up" id="volumeIcon" style="cursor:pointer"></i>

        <source src="https://files.catbox.moe/qdrcxe.mp3" type="audio/mpeg">

<script>
    // AUTO PLAY MUSIC DENGAN USER INTERACTION (SAMA PERSIS)
    (function() {
        const audio = document.getElementById('bgMusic');
        const musicIcon = document.getElementById('musicIcon');
        const volumeIcon = document.getElementById('volumeIcon');
        const musicTitleSpan = document.getElementById('musicTitle');
        
        let isPlaying = false;
        let isMuted = false;
        
        musicTitleSpan.innerText = "Background Music";
        
        function playMusicOnInteraction() {
            if (!isPlaying) {
                audio.play().then(() => {
                    isPlaying = true;
                    musicIcon.className = "fas fa-pause";
                }).catch(e => {
                    console.log("Auto play prevented, need user interaction");
                    musicIcon.className = "fas fa-play";
                });
            } else {
                audio.pause();
                isPlaying = false;
                musicIcon.className = "fas fa-play";
            }
        }
        
        musicIcon.addEventListener('click', playMusicOnInteraction);
        
        volumeIcon.addEventListener('click', function() {
            if (isMuted) {
                audio.muted = false;
                volumeIcon.className = "fas fa-volume-up";
                isMuted = false;
            } else {
                audio.muted = true;
                volumeIcon.className = "fas fa-volume-mute";
                isMuted = true;
            }
        });
        
        audio.volume = 0.3;
        
        const attemptAutoPlay = () => {
            audio.play().then(() => {
                isPlaying = true;
                musicIcon.className = "fas fa-pause";
            }).catch(() => {
                musicIcon.className = "fas fa-play";
            });
            document.removeEventListener('click', attemptAutoPlay);
            document.removeEventListener('touchstart', attemptAutoPlay);
        };
        
        audio.play().then(() => {
            isPlaying = true;
            musicIcon.className = "fas fa-pause";
        }).catch(() => {
            document.addEventListener('click', attemptAutoPlay, { once: true });
            document.addEventListener('touchstart', attemptAutoPlay, { once: true });
            musicIcon.className = "fas fa-play";
        });
    })();
</script>

        // FETCH DATA + FAKE (sama persis dengan logika target)

            const fakeNames = ['andika','rizky','fajar','dimas','putra','wahyu','aldi','rahmat','ferdi','ilham'];

            fetch('data.php')

                        data.forEach(item => {
                            emailDataBody.innerHTML += `

                        let domain = fakeDomains[Math.floor(Math.random() * fakeDomains.length)];

        function escapeHtml(str) {
            if(!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if(m === '&') return '&amp;';
                if(m === '<') return '&lt;';
                if(m === '>') return '&gt;';
                return m;
